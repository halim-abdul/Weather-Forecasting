[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-forecasting-ai"
version = "0.1.0"
description = "Big-data weather pattern detection and forecasting with scikit-learn and PyTorch."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "joblib>=1.3",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
deep = ["torch>=2.2"]
notebook = ["jupyterlab>=4.0", "ipykernel>=6.29"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
