seed: 42
data:
  timestamp_col: timestamp
  target: temperature
  frequency: hourly
split:
  train_fraction: 0.70
  val_fraction: 0.15
features:
  lags: [1, 3, 6, 12, 24]
  rolling_windows: [3, 6, 24]
forecast:
  horizon: 1
sklearn:
  model: hist_gb
torch:
  model: lstm
  sequence_length: 48
  hidden_size: 128
  num_layers: 2
  dropout: 0.2
  batch_size: 64
  epochs: 40
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stop_patience: 8
evaluation:
  rolling_origin: true
  bootstrap_samples: 1000
  conformal_alpha: 0.10
